<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./index.css">
        <title>S.G</title>
    </head>
    <body>
        <!-- 弹幕背景 -->
        <div class="danmaku-bg" id="danmaku"></div>

        <!-- 主内容 -->
        <div class="content">
            <h5><span class="hello">hello</span>, there<span class="tilde">~</span></h5>
            <p class="signature">Shenhai Gan<svg class="sig-line" viewBox="0 0 200 10" xmlns="http://www.w3.org/2000/svg"><path d="M2 6 Q40 3, 80 6 T160 5 T198 6" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"/></svg></p>
        </div>

        <script>
        (function() {
            const lines = [
                "The answer is somewhere. The question is still loading.",
                "La réponse est déjà là. C'est la question qu'on n'a pas encore trouvée.",
                "Die Antwort war schon immer da. Nur die Frage fehlt noch.",
                "La risposta c'è già. È la domanda che non è ancora pronta.",
                "La respuesta siempre estuvo ahí. Lo que falta es la pregunta.",
                "A resposta sempre esteve aí. O que falta é a pergunta.",
                "Het antwoord is er altijd al. Alleen de vraag ontbreekt nog.",
                "Svaret har alltid funnits. Det är frågan som inte är klar än.",
                "Svaret har alltid vært der. Det er spørsmålet som mangler.",
                "Svaret har altid været der. Det er spørgsmålet, der mangler.",
                "Vastaus on aina ollut olemassa. Kysymystä ei vain ole vielä keksitty.",
                "Odpowiedź zawsze tam była. To pytanie jeszcze nie dojrzało.",
                "Odpověď tu vždycky byla. Otázka se teprve rodí.",
                "Odpoveď tu vždy bola. Otázka ešte nedozrela.",
                "A válasz mindig is ott volt. A kérdés az, ami még hiányzik.",
                "Răspunsul a fost mereu acolo. Întrebarea încă nu s-a născut.",
                "Отговорът винаги е бил там. Въпросът все още не е узрял.",
                "Одговор је увек био ту. Питање још није сазрело.",
                "Відповідь завжди була. Просто питання ще не дозріло.",
                "Ответ всегда был. Просто вопрос ещё не придумали.",
                "Η απάντηση ήταν πάντα εκεί. Απλώς η ερώτηση δεν έχει ακόμη διατυπωθεί.",
                "Cevap hep oradaydı. Sadece soru henüz hazır değil.",
                "התשובה תמיד הייתה שם. השאלה פשוט עוד לא הבשילה.",
                "الإجابة كانت دائماً هناك. المشكلة أن السؤال لم يُصَغ بعد.",
                "پاسخ همیشه بوده. فقط سؤال هنوز آماده نشده.",
                "जवाब हमेशा से था। बस सवाल अभी तक सोचा नहीं गया।",
                "উত্তর সবসময় ছিল। শুধু প্রশ্নটা এখনো তৈরি হয়নি।",
                "คำตอบอยู่ตรงนั้นมาตลอด แค่คำถามยังคิดไม่ออก",
                "Câu trả lời luôn ở đó. Chỉ là câu hỏi chưa nghĩ ra thôi.",
                "Jawabannya selalu ada. Cuma pertanyaannya belum kepikiran.",
                "Ang sagot ay nandyan na. Ang tanong lang ang hindi pa naiisip.",
                "Jibu limekuwepo daima. Swali ndilo ambalo bado halijaundwa.",
                "答えはずっとそこにある。まだ問いが思いつかないだけ。",
                "답은 늘 거기 있었다. 다만 질문이 아직 떠오르지 않을 뿐.",
                "答案一直都在那里，只是问题还没想好。",
                "答案一直都在那裡，只是問題還沒想好。",
                "Жауап әрқашан болған. Тек сұрақ әлі ойға келмеген.",
                "პასუხი ყოველთვის იყო. უბრალოდ კითხვა ჯერ არ მომწიფებულა.",
                "Хариулт үргэлж байсан. Зүгээр л асуулт хараахан бодогдоогүй.",
                "Jawapan sentiasa ada. Cuma soalannya belum terfikir lagi."
            ];

            var container = document.getElementById('danmaku');
            var ROW_COUNT = window.innerHeight < 700 ? 16 : 28;

            function createLine(row) {
                var span = document.createElement('span');
                span.className = 'line';

                // 每行只放一条随机翻译
                span.textContent = lines[Math.floor(Math.random() * lines.length)];

                // 位置固定在行轨道上
                var top = (row / ROW_COUNT) * 100;
                span.style.top = top + '%';

                // 随机字号
                var size = 1.4 + Math.random() * 1.6; // 1.4 ~ 3.0
                span.style.fontSize = size + 'em';
                // 大字亮（近处），小字淡（远处）
                var opacity = 0.08 + ((size - 1.4) / 1.6) * 0.22;
                span.style.opacity = opacity;
                // 小字模糊（远处），大字清晰（近处）
                var blur = (1 - (size - 1.4) / 1.6) * 2.5;
                span.style.filter = 'blur(' + blur + 'px)';

                // 速度：大字快（近处），小字慢（远处）
                var t = (size - 1.4) / 1.6;
                var duration = 65 - t * 25;
                var golden = 0.618033988749;
                var delay = -((row * golden) % 1) * duration;
                span.style.animationDuration = duration + 's';
                span.style.animationDelay = delay + 's';

                container.appendChild(span);

                // 动画结束后换新内容和新字号
                span.addEventListener('animationiteration', function() {
                    span.textContent = lines[Math.floor(Math.random() * lines.length)];
                    var newSize = 1.4 + Math.random() * 1.6;
                    span.style.fontSize = newSize + 'em';
                    var newOpacity = 0.08 + ((newSize - 1.4) / 1.6) * 0.22;
                    span.style.opacity = newOpacity;
                    var newBlur = (1 - (newSize - 1.4) / 1.6) * 2.5;
                    span.style.filter = 'blur(' + newBlur + 'px)';
                });
            }

            for (var r = 0; r < ROW_COUNT; r++) {
                createLine(r);
            }
        })();
        </script>
    </body>
</html>
