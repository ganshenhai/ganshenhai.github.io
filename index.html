<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./index.css">
        <title>S.G</title>
    </head>
    <body>
        <!-- 弹幕背景 -->
        <div class="danmaku-bg" id="danmaku"></div>

        <!-- 主内容 -->
        <div class="content">
            <h5><span class="hello">hello</span>, there<span class="tilde">~</span></h5>
            <p class="signature">Shenhai Gan<svg class="sig-line" viewBox="0 0 200 10" xmlns="http://www.w3.org/2000/svg"><path d="M2 6 Q40 3, 80 6 T160 5 T198 6" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"/></svg></p>
        </div>

        <script>
        (function() {
            const lines = [
                "Doing nothing, achieving something.",
                "不费事，也能成事。",
                "不費事，也能成事。",
                "力まなくても、ちゃんと形になる。",
                "애쓰지 않아도, 어떻게든 되더라.",
                "Sans forcer, et pourtant ça marche.",
                "Ohne Mühe, und trotzdem läuft's.",
                "Sin esforzarme, y aun así sale bien.",
                "Senza sforzo, eppure funziona.",
                "Sem esforço, e mesmo assim dá certo.",
                "Zonder moeite, en toch komt het goed.",
                "Utan ansträngning, och ändå blir det bra.",
                "Uten å anstrenge meg, og likevel ordner det seg.",
                "Uden at anstrenge mig, og alligevel går det.",
                "Ei tarvitse yrittää, ja silti homma hoituu.",
                "Bez wysiłku, a jednak się udaje.",
                "Bez námahy, a přesto to vyjde.",
                "Bez námahy, a predsa to vyjde.",
                "Erőlködés nélkül, mégis összejön.",
                "Fără efort, și totuși iese bine.",
                "Без напряга, а всё равно получается.",
                "Без зусиль, а воно таки виходить.",
                "Без усилие, а пак се получава.",
                "Без муке, а ипак успе.",
                "Χωρίς κόπο, κι όμως βγαίνει.",
                "Zahmetsizce, yine de oluyor.",
                "בלי מאמץ, ובכל זאת זה מצליח.",
                "بدون تعب، وبرضو بينجح.",
                "بی‌زحمت، ولی باز هم جور می‌شه.",
                "बिना मेहनत के भी, बात बन जाती है।",
                "খুব একটা না খেটেও, কাজটা হয়ে যায়।",
                "ไม่ต้องออกแรง แต่ก็สำเร็จซะงั้น",
                "Chẳng cần gắng sức mà vẫn xong.",
                "Santai aja, eh malah jadi.",
                "Tak payah bersusah, tapi tetap menjadi.",
                "Walang pinaghirapan, pero umuusad pa rin.",
                "Bila kujikaza, bado mambo yanakwenda.",
                "Әуре болмай-ақ, бәрі жөнге келеді.",
                "ძალისხმევის გარეშე, მაინც გამოდის.",
                "Онц хичээлгүйгээр ч бүтчихдэг."
            ];

            var container = document.getElementById('danmaku');
            var ROW_COUNT = window.innerHeight < 700 ? 16 : 28;

            function createLine(row) {
                var span = document.createElement('span');
                span.className = 'line';

                // 每行只放一条随机翻译
                span.textContent = lines[Math.floor(Math.random() * lines.length)];

                // 位置固定在行轨道上
                var top = (row / ROW_COUNT) * 100;
                span.style.top = top + '%';

                // 随机字号
                var size = 1.4 + Math.random() * 1.6; // 1.4 ~ 3.0
                span.style.fontSize = size + 'em';
                // 大字亮（近处），小字淡（远处）
                var opacity = 0.08 + ((size - 1.4) / 1.6) * 0.22;
                span.style.opacity = opacity;
                // 小字模糊（远处），大字清晰（近处）
                var blur = (1 - (size - 1.4) / 1.6) * 2.5;
                span.style.filter = 'blur(' + blur + 'px)';

                // 速度：大字快（近处），小字慢（远处）
                var t = (size - 1.4) / 1.6;
                var duration = 65 - t * 25;
                var golden = 0.618033988749;
                var delay = -((row * golden) % 1) * duration;
                span.style.animationDuration = duration + 's';
                span.style.animationDelay = delay + 's';

                container.appendChild(span);

                // 动画结束后换新内容和新字号
                span.addEventListener('animationiteration', function() {
                    span.textContent = lines[Math.floor(Math.random() * lines.length)];
                    var newSize = 1.4 + Math.random() * 1.6;
                    span.style.fontSize = newSize + 'em';
                    var newOpacity = 0.08 + ((newSize - 1.4) / 1.6) * 0.22;
                    span.style.opacity = newOpacity;
                    var newBlur = (1 - (newSize - 1.4) / 1.6) * 2.5;
                    span.style.filter = 'blur(' + newBlur + 'px)';
                });
            }

            for (var r = 0; r < ROW_COUNT; r++) {
                createLine(r);
            }
        })();
        </script>
    </body>
</html>
